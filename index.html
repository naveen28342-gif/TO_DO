<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>TO-DO App</title>
		<link rel="stylesheet" href="stylesheet.css" />
	</head>
	<body>
		<div class="app">
			<h1>TO-DO</h1>

		</div>

		<script src="interactive.js"></script>
	</body>
</html>
